experiment:
  seed: 20260812
  dataset_root: results/mtare_transfer_inputs/20260805_campus_indoor_unseen_v2
  output_root: results/offline_topology_node_validation
  encoder_checkpoint: results/structural_bottleneck_feasibility/20260805_231500_forced_global_bottleneck_seed20260805/checkpoint/best.pt
  projection_checkpoint: results/structural_semantic_validation/20260805_240000_teacher_pca64_projection/checkpoint/projection.pt
